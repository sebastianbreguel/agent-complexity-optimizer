name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest

      - name: Run scanner tests
        run: pytest tests/ -v

      - name: Run scanner on fixtures (smoke test)
        run: |
          python skills/complexity-optimizer/scripts/analyze_complexity.py tests/fixtures --format json
          python skills/complexity-optimizer/scripts/analyze_complexity.py tests/fixtures --format markdown
